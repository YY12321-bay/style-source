prompt: |-
  C4D 风格，OC 渲染，纯色背景，高饱和度、8K 高分辨率、高质量。画面中的核心人物是一名 3D 潮流街头风格卡通游泳运动员，正在奋力向前划水冲刺。捕捉动作爆发力最强、最接近极限的一瞬间，采用低角度仰拍，人物比例夸张，贴近镜头的手臂被极度放大，远端肢体缩小，形成近大远小的极端透视对比，动感、阳光活力、充满速度感，强烈的视觉冲击。根据游泳运动加入动态颗粒，飞溅的水珠、细密水雾与空气中流动的水汽微粒，所有效果必须符合游泳运动真实环境，不要无缘无故混用无关元素。
